<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA / Mobile Meta -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <link rel="apple-touch-icon" href="/brand/logo.svg" />
    <link rel="manifest" href="/manifest.json" />

    <title>Signal Scout | Urban Compassion System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind Play CDN (Restores all CSS instantly) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              slate: {
                900: '#020617',
              }
            }
          }
        }
      }
    </script>

    <style>
      /* Keep mission-critical animations here to avoid any bundle delays */
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      @keyframes pop-in { 
        0% { transform: scale(0.8) translateY(20px); opacity: 0; }
        60% { transform: scale(1.05) translateY(-5px); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }
      @keyframes float-up { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-50px); opacity: 0; } }
      @keyframes rain-drop { from { transform: translateY(0); } to { transform: translateY(100vh); } }

      .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
      .animate-scale-in { animation: scale-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-pop-in { animation: pop-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-float-up { animation: float-up 1.5s ease-out forwards; }
      .animate-rain-drop { animation: rain-drop linear infinite; }
    </style>
  </head>
  <body class="bg-[#020617] text-white">
    <div id="root"></div>
    <script>
      // Clear zombie SWs
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
